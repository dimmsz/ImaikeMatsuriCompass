<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="2026 今池まつりの会場を探せる非公式コンパス" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="styles.css?v=20260919-1" />
  <link rel="stylesheet" href="map.css" />
  <link rel="stylesheet" href="tag-filter.css" />
  <title>今池まつり Compass</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">2026 今池まつり</div>
      <h1>Compass</h1>
    </div>
    <button id="locateButton" class="icon-button" type="button" title="現在地を表示" aria-label="現在地を表示">⌖</button>
  </header>

  <main>
    <section class="hero-card">
      <div>
        <div class="hero-title">今池の会場を、すぐ見つける。</div>
        <p>2026年9月20日(日)・21日(月・祝)</p>
      </div>
      <span class="badge">非公式</span>
    </section>

    <section class="controls" aria-label="会場・出演者・ジャンル検索">
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="会場名・出演者・ジャンル・タグで検索" autocomplete="off" />
      </label>
      <section id="tagPanel" class="tag-panel" aria-label="タグで絞り込み">
        <h2 class="tag-panel-title">タグから探す</h2>
        <div id="tagList" class="tag-list"><span class="tag-empty">タグを読み込み中…</span></div>
      </section>
      <section id="tagResults" class="tag-results" aria-live="polite" hidden>
        <h2 id="tagResultTitle"></h2>
        <div id="tagResultList" class="tag-result-list"></div>
      </section>
    </section>

    <section class="map-shell" aria-label="会場マップ">
      <div id="map" class="leaflet-map"></div>
      <details class="map-settings">
        <summary>⚙ 地図の表示設定</summary>
        <div class="map-options" aria-label="地図の表示設定">
          <label><input type="checkbox" id="showBaseMap" checked /> 背景地図（道路・建物・Pなど）</label>
          <label><input type="checkbox" id="showMajorRoads" /> 幹線道路</label>
          <label><input type="checkbox" id="showOtherRoads" /> その他の道路</label>
          <label><input type="checkbox" id="showVenuePins" checked /> 会場ピン</label>
          <label><input type="checkbox" id="showVenueLabels" checked /> 会場名</label>
        </div>
      </details>
      <div class="map-note">地図の表示設定から表示項目を切り替えられます。地図データはOpenStreetMapを利用しています。</div>
    </section>

    <section>
      <div class="section-heading">
        <h2>会場一覧</h2>
        <span id="venueCount"></span>
      </div>
      <div id="venueList" class="venue-list"></div>
    </section>
  </main>

  <dialog id="venueDialog" class="venue-dialog">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close" value="cancel" aria-label="閉じる">×</button>
      <div id="dialogBody"></div>
    </form>
  </dialog>

  <footer>
    <p>地図データ © OpenStreetMap contributors。掲載情報は公式発表をもとにした非公式アプリです。</p>
    <p><a href="https://www.imaike55.com/" target="_blank" rel="noopener">公式サイト</a></p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js?v=20260918-7"></script>
  <script src="map-points.js?v=20260918-1"></script>
  <script src="tag-filter.js?v=20260918-1"></script>
</body>
</html>
