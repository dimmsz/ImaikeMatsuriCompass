<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="2026 今池まつりの会場を探せる非公式コンパス" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>今池まつり Compass</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">2026 今池まつり</div>
      <h1>Compass</h1>
    </div>
    <button id="locateButton" class="icon-button" type="button" title="現在地を表示" aria-label="現在地を表示">⌖</button>
  </header>

  <main>
    <section class="hero-card">
      <div>
        <div class="hero-title">今池の会場を、すぐ見つける。</div>
        <p>2026年9月20日(日)・21日(月・祝)</p>
      </div>
      <span class="badge">非公式</span>
    </section>

    <section class="controls" aria-label="会場検索">
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="会場名・目印で検索" autocomplete="off" />
      </label>
    </section>

    <section class="map-shell" aria-label="会場マップ">
      <div id="map" class="map-placeholder">
        <div class="map-grid"></div>
        <div id="markerLayer" class="marker-layer"></div>
        <div class="map-center-label">今池</div>
      </div>
      <div class="map-note">会場をタップすると詳細が表示されます</div>
    </section>

    <section>
      <div class="section-heading">
        <h2>会場一覧</h2>
        <span id="venueCount"></span>
      </div>
      <div id="venueList" class="venue-list"></div>
    </section>
  </main>

  <dialog id="venueDialog" class="venue-dialog">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close" value="cancel" aria-label="閉じる">×</button>
      <div id="dialogBody"></div>
    </form>
  </dialog>

  <footer>
    <p>掲載情報は公式発表をもとにした非公式アプリです。内容は変更される場合があります。</p>
    <p><a href="https://www.imaike55.com/" target="_blank" rel="noopener">公式サイト</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
